{%- if site.analytics.google_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google_id }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.analytics.google_id }}');
</script>
{%- endif %}
{%- if site.analytics.yandex_id %}
<script>
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id={{ site.analytics.yandex_id }}', 'ym');
    ym({{ site.analytics.yandex_id }}, 'init', {ssr:true, webvisor:true, clickmap:true, accurateTrackBounce:true, trackLinks:true});
</script>
<script>
    // GA4 tracks Turbo's history changes itself; Metrica needs explicit hits.
    (function (id, last) {
        document.addEventListener('turbo:load', function () {
            if (location.href === last) return;
            ym(id, 'hit', location.href, { title: document.title, referer: last });
            last = location.href;
        });
    })({{ site.analytics.yandex_id }}, location.href);
</script>
{%- endif %}
